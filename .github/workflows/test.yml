name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  video-kernel:
    name: video-kernel (library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - uses: gradle/actions/setup-gradle@v4
      # GBL-013 US-5 — the runtime image provides JDK 25; the foojay resolver
      # provisions any other toolchain. `ci/run.sh test` builds this component.
      - name: Build and test
        run: ci/run.sh test
        env:
          COMPONENT: video-kernel

  youtube-auth:
    name: youtube-auth (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ci/run.sh test
        env:
          COMPONENT: youtube-auth
