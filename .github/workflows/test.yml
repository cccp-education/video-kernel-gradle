name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  video-kernel:
    name: video-kernel (library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:03ead3787ed8f09068cc582191e4cd8f5e48e3ce696fe53836ecd826de57ea1f
    steps:
      - uses: actions/checkout@v7
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - uses: gradle/actions/setup-gradle@v6
      # GBL-013 US-5 — the runtime image provides JDK 25; the foojay resolver
      # provisions any other toolchain. `ci/run.sh test` builds this component.
      - name: Build and test
        run: ci/run.sh test
        env:
          COMPONENT: video-kernel

  youtube-auth:
    name: youtube-auth (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:03ead3787ed8f09068cc582191e4cd8f5e48e3ce696fe53836ecd826de57ea1f
    steps:
      - uses: actions/checkout@v7
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ci/run.sh test
        env:
          COMPONENT: youtube-auth
